name: Build OilBill V3 for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.js"
      - "main.cjs"
      - "index.html"
      - "style.css"
      - "db.js"
      - "logic.js"
      - "importers.js"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package Windows application
        run: npm run desktop:build

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: OilBill-V3-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14
